services:
  - type: web
    runtime: static
    name: cogeme-una-rifa-frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    routes:
      # React Router: sirve index.html en cualquier ruta para que recargar no dé 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL pública del backend, sin "/" al final. Render la pide al crear el Blueprint.
      - key: VITE_API_URL
        sync: false
